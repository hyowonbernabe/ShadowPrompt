[package]
name = "shadowprompt"
version = "3.0.1"
edition = "2021"
description = "Lightweight stealth AI assistant for Windows — single executable, hotkey-driven."
license = "Apache-2.0"
repository = "https://github.com/hyowonbernabe/ShadowPrompt"

[features]
default = []
# Enables console window + stdout/file logging. Off in release builds — see docs/SHADOWPROMPT_V3_DESIGN.md §13
# ("log file only on dev flag, silent in prod").
debug = []

[[bin]]
name = "shadowprompt"
path = "src/main.rs"

[lib]
name = "shadowprompt"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

# HTTP (OpenRouter transport; no native-tls, no gzip — rustls only)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Global hotkeys + mouse hook
rdev = "0.5"

# Clipboard (text only — image-on-clipboard support was proposed and declined, design doc §3)
arboard = "3"

# Windows API (Win32 + WinRT). No Media_Ocr feature — OCR is fully removed in v3.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Wdk_System_SystemServices",
] }

# Browser automation: pure-Rust, async-native CDP client. No Node, no Playwright, no bundled
# Chromium — connects to an already-installed/launched Chrome/Edge. See design doc §7.3.
# No features needed: we don't use its browser-fetching capability (chromiumoxide_fetcher/
# native-tls/rustls/zip), only its CDP client for connecting to an existing browser.
chromiumoxide = { version = "0.9", default-features = false }
futures = "0.3"

# Image resize + encode (screenshot -> PNG for vision requests)
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging (dev-flag gated, see logger.rs)
log = "0.4"
simplelog = "0.12"

anyhow = "1"
async-trait = "0.1.92"

[dev-dependencies]
# Mocked HTTP layer for llm/ tests (design doc §13's "no real OpenRouter key in CI" constraint
# means the agentic loop, retry, and model-chain logic get exercised against a local mock
# server instead — see llm/mod.rs's `mod tests` and llm/retry.rs's `mod tests`).
wiremock = "0.6"

[profile.release]
# Size-optimized release profile — design doc §12 ("keep the download small"). This app is
# I/O-bound (HTTP calls, DOM reads), not CPU-bound, so trading a little runtime speed for a
# smaller single EXE is the right call here.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "2"
