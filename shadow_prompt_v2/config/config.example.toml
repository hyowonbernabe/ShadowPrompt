# ShadowPrompt v2 — example config.
# Copy to config.toml and fill in your OpenRouter API key.

[openrouter]
# Get your own key at https://openrouter.ai/keys
# Release builds bundle a 7-day trial key here automatically via the build pipeline.
api_key = ""

# Default model. Must support image inputs (multimodal).
# Examples:
#   anthropic/claude-sonnet-4.6
#   anthropic/claude-opus-4.7
#   google/gemini-2.5-pro
#   openai/gpt-4o
model_id = "anthropic/claude-sonnet-4.6"

[hotkeys]
clipboard_query        = "ctrl+shift+v"
clipboard_query_search = "ctrl+shift+alt+v"      # same as above + live web search
ocr_query              = "ctrl+shift+space"
ocr_query_search       = "ctrl+shift+alt+space"  # same as above + live web search
forms_auto          = "ctrl+shift+9"
forms_single        = "ctrl+shift+7"
abort               = "ctrl+shift+0"
launch_debugger     = "ctrl+shift+i"
hide_toggle         = "ctrl+shift+h"
restart_daemon      = "ctrl+shift+r"
insta_delete        = "ctrl+shift+delete"
panic_kill          = "ctrl+shift+f12"

[visuals]
# Pixel indicator
indicator_corner = "top_right"  # top_left | top_right | bottom_left | bottom_right
indicator_size   = 4            # pixels
indicator_offset = [0, 0]       # [x, y] from corner

color_ready      = "#00FF00"
color_processing = "#FF0000"
color_error      = "#FF00FF"

# Form indicator (second pixel for Forms status)
form_indicator_corner = "top_left"
form_indicator_offset = [0, 0]
form_color_running   = "#FFFF00"
form_color_failed    = "#FF00FF"
form_color_aborted   = "#FF8800"

# Text overlay
overlay_enabled  = true
overlay_corner   = "top_left"
overlay_offset   = [0, 0]
overlay_font_size = 11

[http]
connect_timeout_secs = 10
read_timeout_secs    = 120

[forms]
# Cap on auto-pagination
max_pages = 10
# Per-request image cap (Claude friendly under 20)
max_images_per_request = 20
# Long-edge resize ceiling
max_image_long_edge_px = 1568

[knowledge]
# Reference markdown files in <install_dir>/knowledge/<subject>/ get loaded once
# at startup and injected as a cached system prompt block. Cache hits cost 0.1x
# normal input, so an exam-length session is dramatically cheaper than paying
# full input every call.
enabled = true
# Subject folder names under knowledge/. The _default/ folder is always loaded
# in addition (if it exists). Empty list = only _default/ loads.
active_subjects = ["methods_of_research", "structure_of_programming_language"]
# Anthropic prompt-cache TTL. "5m" (cheaper write, 1.25x) or "1h" (2x but
# covers long idle gaps). Each cache hit refreshes the timer, so as long as
# you query at least once every 5 min the cache never re-writes.
cache_ttl = "5m"
# Hard cap on concatenated knowledge size (~4 chars per token). 800k chars
# is roughly 200k tokens, well under Claude Sonnet 4.6's 1M context window.
max_chars = 800000
