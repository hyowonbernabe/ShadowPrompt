name: Release v3

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shadow_prompt_v3
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shadow_prompt_v3 -> target

      - name: Build release (standard, no elevation)
        run: |
          cargo build --release --features seb
          Copy-Item target/release/shadowprompt.exe -Destination shadowprompt.exe
        shell: pwsh

      - name: Build release (admin)
        run: |
          cargo build --release --features seb,admin
          Copy-Item target/release/shadowprompt.exe -Destination shadowprompt-admin.exe
        shell: pwsh

      - name: Package
        shell: pwsh
        run: |
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item shadowprompt.exe -Destination $stage/
          Copy-Item shadowprompt-admin.exe -Destination $stage/
          New-Item -ItemType Directory -Force -Path "$stage/config" | Out-Null
          Copy-Item config/config.example.toml -Destination "$stage/config/"
          if (Test-Path knowledge) {
            Copy-Item knowledge -Destination "$stage/" -Recurse
          }
          if (Test-Path sebpatch) {
            Copy-Item sebpatch -Destination "$stage/" -Recurse
          }
          Copy-Item install.ps1 -Destination $stage/
          Copy-Item uninstall.ps1 -Destination $stage/
          $tag = "${{ github.ref_name }}"
          $zip = "shadowprompt-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Move-Item $zip ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: true
          files: |
            shadowprompt-${{ github.ref_name }}-windows-x64.zip
