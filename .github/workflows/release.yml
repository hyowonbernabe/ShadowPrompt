name: Release v2

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shadow_prompt_v2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shadow_prompt_v2 -> target

      - name: Build release
        env:
          SHADOWPROMPT_TRIAL_KEY: ${{ secrets.SHADOWPROMPT_TRIAL_KEY }}
        run: cargo build --release

      - name: Package
        shell: pwsh
        env:
          SHADOWPROMPT_TRIAL_KEY: ${{ secrets.SHADOWPROMPT_TRIAL_KEY }}
        run: |
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/shadowprompt.exe -Destination $stage/
          New-Item -ItemType Directory -Force -Path "$stage/config" | Out-Null
          Copy-Item config/config.example.toml -Destination "$stage/config/"
          if (Test-Path knowledge) {
            Copy-Item knowledge -Destination "$stage/" -Recurse
          }

          # Patch config.example.toml in the staging dir so the bundled trial
          # key lands in users' config.toml without any runtime substitution.
          $cfgPath = "$stage/config/config.example.toml"
          if ($env:SHADOWPROMPT_TRIAL_KEY) {
            Write-Host "Injecting trial key into bundled config.example.toml ..."
            $key = $env:SHADOWPROMPT_TRIAL_KEY
            (Get-Content $cfgPath) -replace '^api_key\s*=\s*""\s*$', "api_key = `"$key`"" | Set-Content $cfgPath -Encoding UTF8
            $check = (Get-Content $cfgPath | Select-String "^api_key" | Out-String).Trim()
            Write-Host "Resulting api_key line: $check"
          } else {
            Write-Host "WARNING: SHADOWPROMPT_TRIAL_KEY not set; bundled config will have empty api_key"
          }

          Copy-Item install.ps1 -Destination $stage/
          Copy-Item uninstall.ps1 -Destination $stage/
          $tag = "${{ github.ref_name }}"
          $zip = "shadowprompt-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Move-Item shadowprompt-$tag-windows-x64.zip ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shadow_prompt_v2/target/release/shadowprompt.exe
            shadowprompt-${{ github.ref_name }}-windows-x64.zip
